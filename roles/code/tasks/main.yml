---
# TODO: Move this to jcook3701.utils.snap
- name: Ensure snapd is installed and running
  block:
    - name: Install snapd
      ansible.builtin.package:
        name: snapd
        state: present
    - name: Enable and start snapd socket
      ansible.builtin.systemd:
        name: snapd.socket
        state: started
        enabled: true

- name: Install Visual Studio Code via Snap
  community.general.snap:
    name: code
    classic: true
    state: "{{ code_state | default('present') }}"
